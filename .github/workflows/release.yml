name: Release (latest)

# Rolling "latest" release: on every push to main, rebuilds a signed release
# APK and republishes it to the single release tagged "latest" (replacing the
# previous APK), so there is always exactly one stable download link — no new
# release object is created per push. Signing uses a persistent keystore
# stored as GitHub Secrets (never committed — see android/.gitignore), so
# updates install cleanly over a previously-installed build instead of
# requiring an uninstall (see android/app/build.gradle.kts for why this
# matters: Android refuses to install an update signed with a different key).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

defaults:
  run:
    working-directory: boite_a_outils

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOF

      - run: flutter build apk --release

      - name: Publish "latest" release
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "Dernière version (build automatique)"
          body: |
            APK généré automatiquement depuis le dernier commit sur `main` :
            ${{ github.sha }}

            Ce lien de téléchargement est stable : il pointe toujours vers le
            build le plus récent de `main`, pas vers une version figée.
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          artifacts: "boite_a_outils/build/app/outputs/flutter-apk/app-release.apk"
